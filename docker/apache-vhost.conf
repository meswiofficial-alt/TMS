<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName ${VIRTUAL_HOST}

    # Pass environment variables to PHP
    PassEnv DB_HOST
    PassEnv DB_PORT
    PassEnv DB_NAME
    PassEnv DB_USER
    PassEnv DB_PASS
    PassEnv WHATSAPP_PHONE_ID
    PassEnv WHATSAPP_ACCESS_TOKEN
    PassEnv WHATSAPP_WEBHOOK_TOKEN
    PassEnv TWILIO_SID

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Disable directory listing
        Options -Indexes
    </Directory>

    # Serve backend API files as PHP
    <Directory /var/www/html/backend>
        AllowOverride All
        Require all granted
    </Directory>

    # Static file caching
    <FilesMatch "\.(ico|jpe?g|png|gif|svg|css|js|woff2?)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 week"
        Header append Cache-Control "public, immutable"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
